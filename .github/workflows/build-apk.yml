name: Publicar site e APK
# A cada envio para "main": roda os testes, gera o site e o APK Android e publica tudo no GitHub Pages.
#   Site:      https://<usuario>.github.io/<repositorio>/
#   Instalar:  https://<usuario>.github.io/<repositorio>/instalar.html
#   APK:       https://<usuario>.github.io/<repositorio>/download/garrido-estetica.apk
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm test
      # Usa .env.production (banco real, chave pública). Trava se alguma chave secreta escapar.
      - run: npm run build
      - name: Conferir que nenhuma chave secreta foi para o site
        run: "! grep -rlE 'sb_secret_[A-Za-z0-9_-]{10,}' www .env.production"
      - name: Gerar APK (teste, assinado com chave de depuração)
        run: |
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - name: Montar o site com o APK para download
        run: |
          mkdir -p site/download
          cp -r www/. site/
          cp android/app/build/outputs/apk/debug/app-debug.apk site/download/garrido-estetica.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: garrido-estetica-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
